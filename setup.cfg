[metadata]
name = napari-czann-segment
description = Semantic Segmentation and Image processing using Deep Learning ONNX models packaged as *.czann files
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/sebi06/napari-czann-segment
author = Sebastian Rhode
author_email = sebrhode@gmail.com
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Framework :: napari
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: BSD License
    Operating System :: Unix
    Operating System :: Microsoft :: Windows
    Operating System :: MacOS
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

    Topic :: Scientific/Engineering :: Image Processing
project_urls =
    Bug Tracker = https://github.com/sebi06/napari-czann-segment/issues
    Documentation = https://github.com/sebi06/napari-czann-segment#README.md
    Source Code = https://github.com/sebi06/napari-czann-segment
    User Support = https://github.com/sebi06/napari-czann-segment/issues

[options]
packages = find:
install_requires =
    napari>=0.7.0
    cztile>=2
    czmodel>=6
    tiler
    ryomen

python_requires = >=3.11

include_package_data = True
package_dir =
    =src
setup_requires = setuptools_scm

[options.packages.find]
where = src
exclude =
    _data*
    _scripts*

[options.entry_points]
napari.manifest =
    napari-czann-segment = napari_czann_segment:napari.yaml

[options.extras_require]
# For CPU-only inference (works everywhere)
cpu =
    onnxruntime>=1.19

# For GPU inference on Windows/Linux with NVIDIA GPU:
# Keep the pip CUDA runtime wheels pinned to the CUDA 12.4 / cuDNN 9.1 era.
# Newer nvidia-* wheels can load but may not include kernels for older NVIDIA
# GPUs such as Pascal / compute capability 6.1.
#
# Version pinning: onnxruntime-gpu >= 1.27 requires CUDA 13 DLLs.
# Use < 1.27 to stay on CUDA 12.
#
# See: https://onnxruntime.ai/docs/execution-providers/CUDA-ExecutionProvider.html#requirements
#
gpu =
    onnxruntime-gpu[cuda,cudnn]>=1.19,<1.27
    nvidia-cuda-runtime-cu12==12.4.127
    nvidia-cuda-nvrtc-cu12==12.4.127
    nvidia-cublas-cu12==12.4.5.8
    nvidia-cudnn-cu12==9.1.0.70
    nvidia-cufft-cu12==11.2.1.3
    nvidia-curand-cu12==10.3.5.147
    nvidia-nvjitlink-cu12==12.4.127
testing =
    tox
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-qt  # https://pytest-qt.readthedocs.io/en/latest/
    napari
    pyqt5
    bioio
    bioio-ome-tiff
    bioio-imageio
    tyler
    ryomen



[options.package_data]
* = *.yaml

[options.exclude_package_data]
* =
  *.ome.tiff
  *.czann
  *.tiff
  *.tif
