# Run from the repository root:
#   conda env create --file env_napari_czann_segment.yml
#
# EXAMPLE conda environment for GPU-accelerated inference with napari-czann-segment.
# This is NOT required for CPU-only usage.
#
# For CPU-only usage, simply: pip install napari-czann-segment
# The plugin automatically falls back to CPU if no GPU is detected.
#
# GPU notes:
# - The NVIDIA driver must be installed on the host. Verify with: nvidia-smi
# - Do not mix CUDA libraries from /usr/local/cuda, conda nvidia packages,
#   and pip nvidia packages in the same environment.
# - This file lets the onnxruntime-gpu[cuda12] pip extra install the matching
#   CUDA 12 + cuDNN 9 runtime libraries expected by ONNX Runtime.
# - On Linux, avoid exporting /usr/local/cuda/lib64 ahead of this environment.
#   If needed, launch with: LD_LIBRARY_PATH="$CONDA_PREFIX/lib" napari
# - On Windows, no LD_LIBRARY_PATH is needed. The plugin/ONNX Runtime preloads
#   CUDA DLLs from the Python environment where possible.
#
name: napari-env
channels:
    - conda-forge
    - defaults

dependencies:
    - python=3.12
    - pip
    - wheel
    - setuptools

    - pip:
          # Install the local checkout with GPU support.
          # The [gpu] extra pins onnxruntime-gpu to CUDA 12 compatible releases.
          - -e .[gpu]
          # napari and Qt backend
          - napari[all]>=0.7.0
          # optional napari plugins
          - napari-czitools
          - napari-brightness-contrast
          - napari-layer-details-display

# Create an environment:
#   conda env create --file napari-env.yml
#
# Update an environment:
#   conda env update --name napari-env --file napari-env.yml --prune
#
# Remove an environment:
#   conda remove --name napari-env --all
#
# Verify GPU support after installation:
#   python -c "import onnxruntime; print(onnxruntime.get_available_providers())"
#   # Should show: ['TensorrtExecutionProvider', 'CUDAExecutionProvider', 'CPUExecutionProvider']
#
# Verify actual CUDA execution, not only provider discovery, by running napari
# with the GPU checkbox enabled. The plugin performs a per-model CUDA preflight
# and falls back to CPU if CUDA cannot execute safely.
#
# Linux troubleshooting:
#   echo $LD_LIBRARY_PATH
#   find "$CONDA_PREFIX" -name "libcublasLt.so*"
# If LD_LIBRARY_PATH starts with /usr/local/cuda/lib64, prefer:
#   export LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
# before launching napari.
